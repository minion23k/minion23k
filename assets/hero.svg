<svg width="900" height="330" viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vincent Kyalo: software and network operations">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101a2e"/>
    </linearGradient>
    <clipPath id="c1"><rect class="t t1" x="40" y="68" width="700" height="30"/></clipPath>
    <clipPath id="c2"><rect class="t t2" x="40" y="148" width="700" height="30"/></clipPath>
    <clipPath id="c3"><rect class="t t3" x="40" y="228" width="700" height="30"/></clipPath>
  </defs>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:17px}
    .dim{fill:#8b949e}.fg{fill:#e6edf3}.blue{fill:#58a6ff}.green{fill:#3fb950}
    .name{font-size:24px;font-weight:700;fill:#ffffff}
    .out{opacity:0;animation:in .6s ease both}
    .o1{animation-delay:1.3s}.o2{animation-delay:3.0s}.o3{animation-delay:4.9s}
    @keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
    .t{animation:type 0s steps(1) both}
    .t1{animation:type .8s steps(8) .4s both}
    .t2{animation:type .8s steps(9) 2.1s both}
    .t3{animation:type 1.1s steps(15) 3.7s both}
    @keyframes type{from{width:0}to{width:700px}}
    .cur{opacity:0;animation:blink 1s steps(1) 5.6s infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
    .ring{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out 3s infinite}
    @keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
  </style>

  <rect x=".5" y=".5" width="899" height="329" rx="14" fill="url(#bg)" stroke="#30363d"/>
  <rect x=".5" y=".5" width="899" height="38" rx="14" fill="#161b22"/>
  <rect x=".5" y="24" width="899" height="15" fill="#161b22"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f56"/><circle cx="46" cy="20" r="6" fill="#ffbd2e"/><circle cx="66" cy="20" r="6" fill="#27c93f"/>
  <text x="450" y="25" text-anchor="middle" class="dim" style="font-size:13px">vincent@noc: ~</text>

  <g clip-path="url(#c1)"><text x="40" y="90"><tspan class="green">$</tspan><tspan class="fg"> whoami</tspan></text></g>
  <g class="out o1">
    <text x="40" y="122" class="name">Vincent Kyalo</text>
    <text x="270" y="122" class="dim">software + network operations</text>
  </g>

  <g clip-path="url(#c2)"><text x="40" y="170"><tspan class="green">$</tspan><tspan class="fg"> uptime</tspan></text></g>
  <g class="out o2">
    <circle class="ring" cx="48" cy="198" r="5" fill="#3fb950"/>
    <circle cx="48" cy="198" r="5" fill="#3fb950"/>
    <text x="64" y="204" class="fg">live fiber ISP · 2,000+ customers · 24/7 operations</text>
  </g>

  <g clip-path="url(#c3)"><text x="40" y="250"><tspan class="green">$</tspan><tspan class="fg"> ls ./shipped</tspan></text></g>
  <g class="out o3">
    <text x="40" y="282" class="blue">billmart.pro   zafronixsafari.com   smartpos   outage-tracker   ai-support-agent</text>
  </g>

  <text x="40" y="312" class="cur"><tspan class="green">$</tspan><tspan class="fg"> █</tspan></text>
</svg>