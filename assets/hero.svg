<svg width="900" height="450" viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vincent Kyalo: software and network operations">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101a2e"/>
    </linearGradient>
    <clipPath id="c1"><rect class="t1" x="40" y="68" width="0" height="30"/></clipPath>
    <clipPath id="c2"><rect class="t2" x="40" y="148" width="0" height="30"/></clipPath>
    <clipPath id="c3"><rect class="t3" x="40" y="228" width="0" height="30"/></clipPath>
  </defs>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:17px}
    .dim{fill:#8b949e}.fg{fill:#e6edf3}.blue{fill:#58a6ff}.green{fill:#3fb950}
    .name{font-size:24px;font-weight:700;fill:#ffffff}
    .desc{font-size:15px;fill:#8b949e}

    /* One 13s cycle. List finishes at 6.8s, holds 5s, fades out 11.8s to 12.6s, restarts at 13s. */
    .all{animation:fade 13s linear infinite}
    @keyframes fade{0%{opacity:0}3%{opacity:1}90.77%{opacity:1}96.92%,100%{opacity:0}}

    .t1{animation:tp1 13s linear infinite}
    .t2{animation:tp2 13s linear infinite}
    .t3{animation:tp3 13s linear infinite}
    @keyframes tp1{0%,3.85%{width:0}10%,100%{width:100px}}
    @keyframes tp2{0%,17.69%{width:0}23.85%,100%{width:100px}}
    @keyframes tp3{0%,30.77%{width:0}38.46%,100%{width:180px}}

    .o1{animation:o1 13s ease-in-out infinite}
    .o2{animation:o2 13s ease-in-out infinite}
    @keyframes o1{0%,10%{opacity:0}13.85%,100%{opacity:1}}
    @keyframes o2{0%,23.85%{opacity:0}27.69%,100%{opacity:1}}

    .l1{animation:l1 13s ease-in-out infinite}
    .l2{animation:l2 13s ease-in-out infinite}
    .l3{animation:l3 13s ease-in-out infinite}
    .l4{animation:l4 13s ease-in-out infinite}
    .l5{animation:l5 13s ease-in-out infinite}
    @keyframes l1{0%,38.46%{opacity:0}41.54%,100%{opacity:1}}
    @keyframes l2{0%,41.15%{opacity:0}44.23%,100%{opacity:1}}
    @keyframes l3{0%,43.85%{opacity:0}46.92%,100%{opacity:1}}
    @keyframes l4{0%,46.54%{opacity:0}49.62%,100%{opacity:1}}
    @keyframes l5{0%,49.23%{opacity:0}52.31%,100%{opacity:1}}

    .curwrap{animation:cw 13s linear infinite}
    @keyframes cw{0%,52.31%{opacity:0}53.08%,100%{opacity:1}}
    .cur{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

    .ring{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
    @keyframes pulse{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
  </style>

  <rect x=".5" y=".5" width="899" height="449" rx="14" fill="url(#bg)" stroke="#30363d"/>
  <rect x=".5" y=".5" width="899" height="38" rx="14" fill="#161b22"/>
  <rect x=".5" y="24" width="899" height="15" fill="#161b22"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f56"/><circle cx="46" cy="20" r="6" fill="#ffbd2e"/><circle cx="66" cy="20" r="6" fill="#27c93f"/>
  <text x="450" y="25" text-anchor="middle" class="dim" style="font-size:13px">vincent@noc: ~</text>

  <g class="all">
    <g clip-path="url(#c1)"><text x="40" y="90"><tspan class="green">$</tspan><tspan class="fg"> whoami</tspan></text></g>
    <g class="o1">
      <text x="40" y="122" class="name">Vincent Kyalo</text>
      <text x="270" y="122" class="dim">software + network operations</text>
    </g>

    <g clip-path="url(#c2)"><text x="40" y="170"><tspan class="green">$</tspan><tspan class="fg"> uptime</tspan></text></g>
    <g class="o2">
      <circle class="ring" cx="48" cy="198" r="5" fill="#3fb950"/>
      <circle cx="48" cy="198" r="5" fill="#3fb950"/>
      <text x="64" y="204" class="fg">live fiber ISP &#183; 2,000+ customers &#183; 24/7 operations</text>
    </g>

    <g clip-path="url(#c3)"><text x="40" y="250"><tspan class="green">$</tspan><tspan class="fg"> tree ./shipped</tspan></text></g>

    <g class="l1">
      <text x="40" y="282" class="dim">&#9500;&#9472;&#9472;</text>
      <text x="80" y="282" class="blue">billmart.pro</text>
      <text x="340" y="282" class="desc">fiber ISP website</text>
    </g>
    <g class="l2">
      <text x="40" y="308" class="dim">&#9500;&#9472;&#9472;</text>
      <text x="80" y="308" class="blue">zafronixsafari.com</text>
      <text x="340" y="308" class="desc">safari operator &#183; deployed &amp; hosted</text>
    </g>
    <g class="l3">
      <text x="40" y="334" class="dim">&#9500;&#9472;&#9472;</text>
      <text x="80" y="334" class="blue">smartpos</text>
      <text x="340" y="334" class="desc">sales, stock &amp; access control</text>
    </g>
    <g class="l4">
      <text x="40" y="360" class="dim">&#9500;&#9472;&#9472;</text>
      <text x="80" y="360" class="blue">outage-tracker</text>
      <text x="340" y="360" class="desc">live fiber outage tracking</text>
    </g>
    <g class="l5">
      <text x="40" y="386" class="dim">&#9492;&#9472;&#9472;</text>
      <text x="80" y="386" class="blue">ai-support-agent</text>
      <text x="340" y="386" class="desc">WhatsApp &amp; web self-service</text>
    </g>

    <g class="curwrap"><text x="40" y="424" class="cur"><tspan class="green">$</tspan><tspan class="fg"> &#9608;</tspan></text></g>
  </g>
</svg>